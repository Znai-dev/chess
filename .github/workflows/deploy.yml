name: build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          push: true
          tags: |
            ghcr.io/znai-dev/chess-${{ matrix.component }}:latest
            ghcr.io/znai-dev/chess-${{ matrix.component }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # The images are on ghcr now, so it is safe to tell the server to pull.
      # Authorisation is the HMAC signature, exactly as for a real GitHub hook.
      - name: Trigger server deploy
        env:
          DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}
        run: |
          BODY=$(jq -nc \
            --arg repo "${{ github.repository }}" \
            --arg ref  "${{ github.ref }}" \
            '{repository: {full_name: $repo}, ref: $ref}')
          SIG=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "$DEPLOY_SECRET" | awk '{print $NF}')
          curl -sS --fail-with-body -X POST https://deploy.mriiacraft.pp.ua/hook \
            -H 'Content-Type: application/json' \
            -H 'X-GitHub-Event: push' \
            -H "X-Hub-Signature-256: sha256=$SIG" \
            --data "$BODY"
